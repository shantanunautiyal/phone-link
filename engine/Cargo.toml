[workspace]
members = ["crates/*"]
# A bare `cargo build`, `cargo test` or `cargo clippy` in this directory covers every crate.
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.dependencies]
# The engine's own crates.
phonelink-proto = { path = "crates/proto" }
phonelink-core = { path = "crates/core" }
phonelink-transport = { path = "crates/transport" }
phonelink-app = { path = "crates/app" }
phonelink-nano = { path = "crates/nano" }
phonelink-features = { path = "crates/features" }
phonelink-notifications = { path = "crates/notifications" }
phonelink-phone-apps = { path = "crates/phone-apps" }
phonelink-device-status = { path = "crates/device-status" }
phonelink-bluetooth = { path = "crates/bluetooth" }
phonelink-audio = { path = "crates/audio" }
phonelink-hotspot = { path = "crates/hotspot" }
phonelink-screen-mirroring = { path = "crates/screen-mirroring" }
phonelink-clipboard = { path = "crates/clipboard" }
phonelink-connected-camera = { path = "crates/connected-camera" }
phonelink-calling = { path = "crates/calling" }
phonelink-contacts = { path = "crates/contacts" }
phonelink-file-transfer = { path = "crates/file-transfer" }
phonelink-messaging = { path = "crates/messaging" }
phonelink-phone-files = { path = "crates/phone-files" }
phonelink-photos = { path = "crates/photos" }
phonelink-remote-control = { path = "crates/remote-control" }
phonelink-remote-snipping = { path = "crates/remote-snipping" }
phonelink-wallpaper = { path = "crates/wallpaper" }
aes = "0.8"
# AES-128-GCM of the Nano path's SRTP (aes 0.9).
aes-gcm = "0.11"
async-trait = "0.1"
base64 = "0.22"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
hmac = "0.13"
crc32fast = "1"
clap = { version = "4", features = ["derive", "env"] }
encoding_rs = "0.8"
flate2 = "1"
# The query of the phone's ms-phone:remoting launch URI.
form_urlencoded = "1"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
# getifaddrs and if_nametoindex for the Nano path's host candidates.
libc = "0.2"
md-5 = "0.11"
p384 = "0.14"
phonenumber = "0.3"
plist = "1"
prost = "0.13"
prost-types = "0.13"
rand = "0.9"
# The RSA crate's RNG and OAEP digest traits (rand_core 0.6, digest 0.10).
rand_core06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rmpv = "1.3"
roxmltree = "0.20"
rsa = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
sha2_010 = { package = "sha2", version = "0.10" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal", "fs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uniffi = { version = "0.29.5", features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
x509-cert = { version = "0.3", features = ["builder"] }
# Build and test only.
prost-build = "0.13"
protox = "0.7"
tempfile = "3"
axum = { version = "0.8.9", features = ["ws"] }

[package]
name = "phonelink-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Protocol and feature core of the macOS Phone Link port"
# The integration tests are modules of one test binary (`tests/main.rs`), not a binary per file.
autotests = false

[lib]
name = "phonelink_engine"
# The app links a static library, which gui/scripts/build-engine.sh asks for with `cargo rustc
# --crate-type staticlib`: a crate type listed here would be built on every `cargo test` and
# `cargo build` as well.
crate-type = ["lib"]
doctest = false

[[bin]]
name = "phonelink"
path = "src/bin/phonelink/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
# Builds the crate's own uniffi-bindgen binary (`cargo run --features bindgen-cli --bin uniffi-bindgen`).
bindgen-cli = ["uniffi/cli"]
# The fakes and builders the tests use, in this crate and the crates beneath it. The dev-dependency on
# this crate below turns it on for `cargo test` and `cargo clippy --all-targets` only; the app and the
# CLI build without it.
test-support = [
    "phonelink-proto/test-support",
    "phonelink-core/test-support",
    "phonelink-transport/test-support",
    "phonelink-app/test-support",
    "phonelink-nano/test-support",
    "phonelink-features/test-support",
    "phonelink-notifications/test-support",
    "phonelink-phone-apps/test-support",
    "phonelink-device-status/test-support",
    "phonelink-bluetooth/test-support",
    "phonelink-audio/test-support",
    "phonelink-hotspot/test-support",
    "phonelink-screen-mirroring/test-support",
    "phonelink-clipboard/test-support",
    "phonelink-connected-camera/test-support",
    "phonelink-calling/test-support",
    "phonelink-contacts/test-support",
    "phonelink-file-transfer/test-support",
    "phonelink-messaging/test-support",
    "phonelink-phone-files/test-support",
    "phonelink-photos/test-support",
    "phonelink-remote-control/test-support",
    "phonelink-remote-snipping/test-support",
    "phonelink-wallpaper/test-support",
]

[dependencies]
# The engine's crates beneath this one.
phonelink-proto.workspace = true
phonelink-core.workspace = true
phonelink-transport.workspace = true
phonelink-app.workspace = true
phonelink-nano.workspace = true
phonelink-features.workspace = true
phonelink-notifications.workspace = true
phonelink-phone-apps.workspace = true
phonelink-device-status.workspace = true
phonelink-bluetooth.workspace = true
phonelink-audio.workspace = true
phonelink-hotspot.workspace = true
phonelink-screen-mirroring.workspace = true
phonelink-clipboard.workspace = true
phonelink-connected-camera.workspace = true
phonelink-calling.workspace = true
phonelink-contacts.workspace = true
phonelink-file-transfer.workspace = true
phonelink-messaging.workspace = true
phonelink-phone-files.workspace = true
phonelink-photos.workspace = true
phonelink-remote-control.workspace = true
phonelink-remote-snipping.workspace = true
phonelink-wallpaper.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi.workspace = true
uuid.workspace = true

[dev-dependencies]
phonelink-engine = { path = ".", features = ["test-support"] }
axum.workspace = true
flate2.workspace = true
futures-util.workspace = true
p384.workspace = true
prost.workspace = true
prost-types.workspace = true
rand_core06.workspace = true
rmpv.workspace = true
roxmltree.workspace = true
rsa.workspace = true
rusqlite.workspace = true
sha2_010.workspace = true
tempfile.workspace = true
x509-cert.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "engine"
path = "tests/main.rs"

# RSA key generation takes seconds without optimization.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# The lint set the code is held to, for every crate of the workspace. `just engine-lint` runs clippy
# with `-D warnings`, so every lint at `warn` here fails the lint run. Thresholds are in `clippy.toml`.
[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
missing_docs = "allow"                 # an internal item needs a doc only where its name is not enough

[workspace.lints.clippy]
# Function size and shape.
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
large_enum_variant = "warn"
# Visibility.
redundant_pub_crate = "allow"          # contradicts unreachable_pub, which lib.rs turns on
# Errors and panics.
map_err_ignore = "allow"               # a cause that says nothing may be dropped
unwrap_used = "warn"
expect_used = "allow"                  # `expect` states the invariant it relies on
panic = "allow"                        # a bug panics with the values that broke it
unreachable = "allow"                  # as `panic`
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Locks and tasks.
await_holding_lock = "warn"
significant_drop_in_scrutinee = "allow" # narrowing a guard changes what other threads see
mutex_atomic = "warn"
mutex_integer = "warn"
disallowed_methods = "deny"
# Names and types.
wrong_self_convention = "warn"
should_implement_trait = "warn"
new_without_default = "warn"
inconsistent_struct_constructor = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "allow"       # settings and status records hold independent switches
enum_glob_use = "warn"
wildcard_imports = "warn"
# Docs.
too_long_first_doc_paragraph = "warn"
doc_markdown = "warn"
