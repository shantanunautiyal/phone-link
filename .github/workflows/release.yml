name: Release

# Builds the Phone Link DMG and attaches it to a GitHub Release. Triggered by pushing a version
# tag (e.g. `git tag v0.4.2 && git push origin v0.4.2`), or manually from the Actions tab (the
# manual run attaches to the latest tag's release; pass a tag via the input to name one).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag the release should attach to (e.g. v0.4.2); defaults to the latest tag"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (log version)
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The runner pre-installs rustup via Homebrew (/opt/homebrew/bin), so the toolchain action
      # reuses it and cargo lands there. The engine build script looks for cargo strictly at
      # ~/.cargo/bin; link it there too.
      - name: Expose cargo at ~/.cargo/bin
        run: |
          mkdir -p "$HOME/.cargo/bin"
          ln -sfn "$(command -v cargo)" "$HOME/.cargo/bin/cargo"
          ln -sfn "$(command -v rustc)" "$HOME/.cargo/bin/rustc"
          ln -sfn "$(command -v rustup)" "$HOME/.cargo/bin/rustup"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}

      - name: Pre-build the engine and its bindings
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          # Generates gui/Generated/ (the uniffi Swift bindings and module map) and the release static
          # library, so the Xcode build's own engine phase finds them ready and the Swift targets do
          # not race it for the module map on a cold build.
          ENGINE_PROFILE=release gui/scripts/build-engine.sh

      - name: Build the DMG
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          # Xcode 26's Explicitly Built Modules (default) break the module-cache resolution of the
          # camera extension in this project; build with implicit modules, which is what the project
          # was built with before Xcode 26.
          xcodebuild \
            -project gui/PhoneLink.xcodeproj \
            -scheme PhoneLink \
            -configuration Release \
            -derivedDataPath gui/build/DerivedData \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            build
          gui/scripts/make-dmg.sh \
            gui/build/DerivedData/Build/Products/Release/PhoneLink.app \
            gui/build

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-dmg
          path: gui/build/PhoneLink-*.dmg
          if-no-files-found: error

      - name: Attach DMG to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: gui/build/PhoneLink-*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
